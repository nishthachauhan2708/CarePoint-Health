---
# Tasks for Application Deployment Role
- name: Create application deployment directory
  file:
    path: "{{ install_dir }}"
    state: directory
    mode: '0755'
  become: yes

- name: Create CareHealth Point Kubernetes Namespace
  command: kubectl apply -f kubernetes/base/namespace.yaml
  register: k8s_ns_res
  changed_when: "'created' in k8s_ns_res.stdout"

- name: Apply ConfigMaps and Secrets
  command: "kubectl apply -f kubernetes/base/{{ item }}"
  loop:
    - configmap.yaml
    - secret.yaml
    - rbac.yaml
    - network-policy.yaml
  register: k8s_cfg_res
  changed_when: "'configured' in k8s_cfg_res.stdout or 'created' in k8s_cfg_res.stdout"

- name: Deploy PostgreSQL StatefulSet & Storage
  command: "kubectl apply -f kubernetes/base/{{ item }}"
  loop:
    - postgres-pvc.yaml
    - postgres-statefulset.yaml

- name: Deploy Backend and Frontend Workloads
  command: "kubectl apply -f kubernetes/base/{{ item }}"
  loop:
    - backend-deployment.yaml
    - frontend-deployment.yaml
    - ingress.yaml
    - hpa.yaml

- name: Wait for backend deployment to become ready
  command: kubectl rollout status deployment/carehealth-backend-deployment -n {{ k8s_namespace }} --timeout=120s
  changed_when: false
