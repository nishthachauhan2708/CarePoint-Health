- name: Configure Docker Host Prerequisites
  hosts: localhost
  connection: local
  gather_facts: yes
  roles:
    - docker
    - kubernetes

- name: Deploy CareHealth Point Application Stack
  hosts: localhost
  connection: local
  gather_facts: no
  roles:
    - app_deploy
