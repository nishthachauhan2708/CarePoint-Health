groups:
  - name: carehealth_alerts
    rules:
      # Alert: Service Unavailable
      - alert: CareHealthBackendDown
        expr: up{job="carehealth-backend"} == 0
        for: 1m
        labels:
          severity: critical
          tier: api
        annotations:
          summary: "CareHealth Point Backend API is unreachable"
          description: "Instance {{ $labels.instance }} has been down for more than 1 minute."

      # Alert: High HTTP 5xx Error Rate
      - alert: HighHttpErrorRate
        expr: sum(rate(carehealth_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(carehealth_http_requests_total[5m])) * 100 > 5
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx server error rate detected"
          description: "Server error rate is {{ $value | printf \"%.2f\" }}% (> 5% threshold over 5m)."

      # Alert: High API Latency
      - alert: SlowApiResponseTime
        expr: histogram_quantile(0.95, sum(rate(carehealth_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API 95th percentile latency elevated"
          description: "95% of requests are taking longer than 1.5s to respond (current: {{ $value | printf \"%.2f\" }}s)."
