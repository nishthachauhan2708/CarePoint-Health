global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # CareHealth Point FastAPI Backend Scrape Job
  - job_name: "carehealth-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000", "localhost:8000"]
        labels:
          app: "carehealth-backend"
          environment: "production"
          service: "clinical-api"

  # Node Exporter (Host Metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
