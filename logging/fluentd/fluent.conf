# ==============================================================================
# CareHealth Point – Fluentd Centralized Logging Configuration
# Course: DevOps & Automation Lab (ENSP461)
# ==============================================================================

# Input: Tail container and application log files
<source>
  @type tail
  path /var/log/containers/*carehealth*.log
  pos_file /var/log/fluentd-carehealth.pos
  tag carehealth.k8s.*
  read_from_head true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    keep_time_key true
  </parse>
</source>

# Input: Listen for forwarder protocol (from Docker log driver)
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Filter: Enrich with metadata & mask sensitive health credentials
<filter carehealth.**>
  @type record_transformer
  enable_ruby true
  <record>
    platform "carehealth-point"
    environment "production"
    cluster "minikube-local"
    log_processed_at ${time.strftime('%Y-%m-%dT%H:%M:%SZ')}
    # Sanitize passwords or JWT tokens if present in query parameters
    message ${record["log"] ? record["log"].gsub(/(password|token|secret)=[^&\s]+/, '\1=[REDACTED]') : record["message"]}
  </record>
</filter>

# Output: Route structured logs to console and centralized persistent store
<match carehealth.**>
  @type copy
  <store>
    @type stdout
    <format>
      @type json
    </format>
  </store>
  <store>
    @type file
    path /fluentd/log/carehealth-centralized
    compress gzip
    <buffer>
      timekey 1d
      timekey_use_utc true
      timekey_wait 10m
    </buffer>
  </store>
</match>
