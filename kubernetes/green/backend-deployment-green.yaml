apiVersion: apps/v1
kind: Deployment
metadata:
  name: carehealth-backend-green
  namespace: carehealth
  labels:
    app: carehealth-backend
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carehealth-backend
      version: green
  template:
    metadata:
      labels:
        app: carehealth-backend
        version: green
    spec:
      containers:
        - name: backend
          image: carehealth/carehealth-backend:2.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: carehealth-config
            - secretRef:
                name: carehealth-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
