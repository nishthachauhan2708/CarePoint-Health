apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carehealth-ingress
  namespace: carehealth
  labels:
    app.kubernetes.io/name: carehealth-point
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  rules:
    - host: carehealth.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: carehealth-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: carehealth-frontend-service
                port:
                  number: 80
