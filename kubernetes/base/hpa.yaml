apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carehealth-backend-hpa
  namespace: carehealth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carehealth-backend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: carehealth-frontend-hpa
  namespace: carehealth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: carehealth-frontend-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
