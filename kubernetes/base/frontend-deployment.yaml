apiVersion: apps/v1
kind: Deployment
metadata:
  name: carehealth-frontend-deployment
  namespace: carehealth
  labels:
    app: carehealth-frontend
    app.kubernetes.io/name: carehealth-point
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: carehealth-frontend
  template:
    metadata:
      labels:
        app: carehealth-frontend
        environment: production
    spec:
      containers:
        - name: carehealth-frontend
          image: carehealth/carehealth-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: carehealth-frontend-service
  namespace: carehealth
  labels:
    app: carehealth-frontend
    app.kubernetes.io/name: carehealth-point
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: carehealth-frontend
