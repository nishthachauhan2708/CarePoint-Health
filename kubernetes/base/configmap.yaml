apiVersion: v1
kind: ConfigMap
metadata:
  name: carehealth-config
  namespace: carehealth
  labels:
    app.kubernetes.io/name: carehealth-point
data:
  ENVIRONMENT: "production"
  PROJECT_NAME: "CareHealth Point"
  VERSION: "1.0.0"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  POSTGRES_HOST: "carehealth-postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "carehealth_db"
  POSTGRES_USER: "carehealth_admin"
  VITE_API_BASE_URL: "/api/v1"
