apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carehealth-postgres
  namespace: carehealth
  labels:
    app: carehealth-postgres
    app.kubernetes.io/name: carehealth-point
spec:
  serviceName: carehealth-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: carehealth-postgres
  template:
    metadata:
      labels:
        app: carehealth-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: carehealth-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: carehealth-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carehealth-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - carehealth_admin
                - -d
                - carehealth_db
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - carehealth_admin
                - -d
                - carehealth_db
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: carehealth-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: carehealth-postgres-service
  namespace: carehealth
  labels:
    app: carehealth-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app: carehealth-postgres
