apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carehealth-db-isolation-policy
  namespace: carehealth
spec:
  podSelector:
    matchLabels:
      app: carehealth-postgres
  policyTypes:
    - Ingress
  ingress:
    # Allow database connections ONLY from the backend application pods
    - from:
        - podSelector:
            matchLabels:
              app: carehealth-backend
      ports:
        - protocol: TCP
          port: 5432
