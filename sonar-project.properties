# ==============================================================================
# CareHealth Point – SonarQube Static Code Analysis Configuration
# Course: DevOps & Automation Lab (ENSP461)
# ==============================================================================

# Project Identification
sonar.projectKey=carehealth-point
sonar.projectName=CareHealth Point - Smart Hospital Management System
sonar.projectVersion=1.0.0

# Source & Test Code Paths
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Encodings
sonar.sourceEncoding=UTF-8

# Language Specific Configurations
sonar.python.version=3.9
sonar.python.xunit.reportPath=backend/test-reports/junit.xml
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.pytest_cache/**,**/build/**,**/*.spec.ts,**/coverage/**,**/__pycache__/**
sonar.coverage.exclusions=backend/tests/**,frontend/src/vite-env.d.ts

# Quality Gates
sonar.qualitygate.wait=false
